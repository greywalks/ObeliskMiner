<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Obelisk Miner Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --rock: #242b34;
  --rock-2: #2e3742;
  --rock-3: #38424f;
  --seam: #46525f;
  --ink: #e8ecf1;
  --ink-2: #a6b1bf;
  --copper: #d6893f;
  --copper-2: #f0a75c;
  --mithril: #63b7a4;
  --amber: #e0b04b;
  --ember: #d9655a;
  --radius: 6px;
  --radius-lg: 10px;
  --font: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--rock); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
a { color: var(--copper-2); }
h1, h2, h3 { margin: 0 0 .5rem; line-height: 1.2; font-weight: 700; }
h1 { font-size: 1.55rem; letter-spacing: -.01em; }
h2 { font-size: 1.2rem; margin-top: .25rem; }
h3 { font-size: 1rem; color: var(--ink-2); font-weight: 600; }
p { margin: 0 0 .75rem; max-width: 70ch; }
code { font-family: ui-monospace, "Cascadia Code", Menlo, monospace; font-size: .9em; background: var(--rock-3); padding: .05em .35em; border-radius: 4px; }
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--rock-3); border: 1px solid var(--seam); color: var(--ink);
  padding: .45rem .9rem; border-radius: var(--radius); cursor: pointer;
}
button:hover { border-color: var(--copper); }
button.primary { background: var(--copper); border-color: var(--copper); color: #1a1208; font-weight: 700; }
button.primary:hover { background: var(--copper-2); }
button.danger { color: var(--ember); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
  outline: 2px solid var(--mithril); outline-offset: 2px;
}
input, select, textarea {
  background: var(--rock); border: 1px solid var(--seam); border-radius: var(--radius);
  padding: .4rem .55rem;
}
input[type="number"] { width: 9rem; }
textarea { width: 100%; min-height: 220px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: .85rem; }
label { display: inline-flex; flex-direction: column; gap: .25rem; font-size: .85rem; color: var(--ink-2); }
label > input, label > select { color: var(--ink); }

.layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.side {
  background: var(--rock-2); border-right: 1px solid var(--seam);
  padding: 1.1rem .9rem; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow: auto;
}
.brand { display: flex; align-items: center; gap: .6rem; margin-bottom: 1.2rem; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand b { display: block; font-size: 1.05rem; }
.brand small { color: var(--ink-2); }
.nav { display: flex; flex-direction: column; gap: .15rem; }
.nav a {
  color: var(--ink); text-decoration: none; padding: .5rem .65rem; border-radius: var(--radius);
  border-left: 3px solid transparent;
}
.nav a:hover { background: var(--rock-3); }
.navhead { color: var(--ink-2); font-size: .78rem; padding: .7rem .65rem .15rem; }
.nav a.active { background: var(--rock-3); border-left-color: var(--copper); }
.side .snap { margin-top: 1.4rem; font-size: .85rem; color: var(--ink-2); }
.side .snap select { width: 100%; margin-top: .3rem; }

.main { padding: 1.4rem 1.8rem 3rem; min-width: 0; }
.main > section { display: none; }
.main > section.active { display: block; }

.panel {
  background: var(--rock-2); border: 1px solid var(--seam); border-radius: var(--radius-lg);
  padding: 1rem 1.1rem; margin-bottom: 1rem;
}
.panel.accent { border-left: 4px solid var(--copper); }
.row { display: flex; flex-wrap: wrap; gap: .75rem 1.2rem; align-items: flex-end; }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
.muted { color: var(--ink-2); }
.small { font-size: .85rem; }
.ok { color: var(--mithril); }
.warn { color: var(--amber); }
.bad { color: var(--ember); }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: .7rem; margin-bottom: 1rem; }
.tile { background: var(--rock-2); border: 1px solid var(--seam); border-radius: var(--radius-lg); padding: .75rem .9rem; }
.tile .v { font-size: 1.35rem; font-weight: 700; }
.tile .k { color: var(--ink-2); font-size: .82rem; }

table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .4rem .55rem; border-bottom: 1px solid var(--seam); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; }
td.num, th.num { text-align: right; }
tr.hl td { background: rgba(214,137,63,.08); }
.tablewrap { overflow-x: auto; }
.bar { height: 6px; background: var(--rock); border-radius: 3px; overflow: hidden; margin-top: .3rem; }
.bar > i { display: block; height: 100%; background: var(--mithril); }
.bar > i.over { background: var(--amber); }

.drop {
  border: 2px dashed var(--seam); border-radius: var(--radius-lg); padding: 1.2rem; text-align: center;
  color: var(--ink-2); margin-bottom: .75rem;
}
.drop.hover { border-color: var(--copper); color: var(--ink); }
.toast {
  position: fixed; left: 50%; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--rock-3); border: 1px solid var(--copper); padding: .6rem 1rem; border-radius: var(--radius);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }
.empty { padding: 2rem 1rem; text-align: center; color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; }
.search { width: 100%; max-width: 420px; }
.pill { display: inline-block; padding: .05rem .5rem; border-radius: 999px; background: var(--rock-3); font-size: .8rem; color: var(--ink-2); }

@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--seam); }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .nav a { border-left: 0; border-bottom: 3px solid transparent; }
  .nav a.active { border-bottom-color: var(--copper); }
  .main { padding: 1rem; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

</style>
</head>

      rFloorC: c01(n(s.rainbow_floor_chance) / 100), rFloorM: n(s.rainbow_floor_multi, 1),

        el('p', {}, `Frogger fires every ${r.timeBetweenFires.toFixed(2)} s. ` + (breakEven ? `Frogger pays for its own fuel from grade ${breakEven.grade} up.` : 'Frogger never pays for its fuel with these inputs.')),
        OM.table(['Grade', 'Avg bombs / fire', 'Gems / fire', 'Fires per fuel', 'Fuel lasts', 'Gems / hour', 'Fuel cost / hour', 'Net / hour'],
          r.rows.filter(x => x.grade % 5 === 0 || x.grade === myGrade || Math.abs(x.grade - myGrade) <= 2).map(x => ({ cells: [x.grade, fmt(x.avgBombs), fmt(x.gemsPerFire, 3), fmt(x.firesPerFuel), dur(x.fuelDuration), fmt(x.grossPerHour), fmt(x.costPerHour), el('span', { class: x.netPerHour >= 0 ? 'ok' : 'bad' }, fmt(x.netPerHour))], hl: x.grade === myGrade })), { num: [0, 1, 2, 3, 4, 5, 6, 7] })
      ]));
    }
    root.appendChild(el('div', { class: 'panel' }, el('div', { class: 'row' }, [
      num(st, 'fuelDurationMult', 'Fuel duration multiplier', { on: render }), num(st, 'fuelSaveChance', 'Fuel save chance (0-1)', { on: render }), num(st, 'freeBombChance', 'Free bomb chance (0-1)', { on: render }),
      num(st, 'd20Charges', 'D20 charges refilled', { on: render }), num(st, 'cherryTriple', 'Cherry triple chance (0-1)', { on: render }), num(st, 'gemChance', 'Gem bomb gem chance (0-1)', { on: render, step: '0.001' }),
      num(st, 'level', 'Frogger level', { on: render, step: '1' }), num(st, 'gameSpeed', 'Game speed', { on: render }), chk(st, 'cherryOnBattery', 'Spend cherry charges on battery bombs', render)
    ])));
    root.appendChild(out);
    render();
  };

  // ---------- Lootfrogs ----------
  OM.views.lootfrogs = function (root, snap) {
    root.innerHTML = '';
    if (!snap) { root.appendChild(needSnap()); return; }
    const s = snap.stats;
    root.appendChild(el('h1', {}, 'Lootfrog rewards'));
    root.appendChild(el('p', { class: 'muted' }, 'Average loot per frog, per spawn, and per full-capacity spawn. Ported from the Public Frogspawn Calculator.'));
    const st = { lootMulti: g(s, 'lootfrog_loot_multi', 1), gemMulti: 1, goldChance: g(s, 'lootfrog_golden_chance', 0), goldMulti: g(s, 'lootfrog_golden_multi', 1), bigChance: g(s, 'lootfrog_big_chance', 0), bigMulti: g(s, 'lootfrog_big_multi', 1),
      massiveChance: g(s, 'lootfrog_massive_chance', 0), massiveMulti: g(s, 'lootfrog_massive_multi', 1), tripleSpawn: g(s, 'lootfrog_triple_spawn_chance', 0), tenxSpawn: g(s, 'lootfrog_10x_spawn_chance', 0), capacity: g(s, 'lootfrog_capacity', 1) };
    const out = el('div');
    function render() {
      const rows = OM.calc.lootfrogs(st);
      out.innerHTML = '';
      out.appendChild(el('div', { class: 'panel accent' }, [
        el('h2', {}, `${fmt(rows.find(r => r.name === 'Gems').perFullSpawn)} gems per full spawn on average`),
        OM.table(['Reward', 'Per frog', 'Per spawn', 'Per full spawn'], rows.map(r => [r.name, fmt(r.perFrog, 3), fmt(r.perSpawn, 3), fmt(r.perFullSpawn, 2)]), { num: [1, 2, 3] }),
        el('p', { class: 'small muted', style: 'margin-top:.5rem' }, 'Lanterns, frogspawn and frogurt are capped per frog kind, as in the source sheet. Set the gem multiplier if you have a lootfrog gem bonus the export does not show.')
      ]));
    }
    root.appendChild(el('div', { class: 'panel' }, el('div', { class: 'row' }, [
      num(st, 'lootMulti', 'Loot multiplier', { on: render }), num(st, 'gemMulti', 'Gem multiplier', { on: render }), num(st, 'goldChance', 'Golden %', { on: render }), num(st, 'goldMulti', 'Golden multiplier', { on: render }),
      num(st, 'bigChance', 'Big %', { on: render }), num(st, 'bigMulti', 'Big multiplier', { on: render }), num(st, 'massiveChance', 'Massive %', { on: render }), num(st, 'massiveMulti', 'Massive multiplier', { on: render }),
      num(st, 'tripleSpawn', 'Triple spawn %', { on: render }), num(st, 'tenxSpawn', '10x spawn %', { on: render }), num(st, 'capacity', 'Capacity', { on: render })
    ])));
    root.appendChild(out);
    render();
  };

  // ---------- Card shards ----------
  OM.views.cards = function (root, snap) {
    root.innerHTML = '';
    if (!snap) { root.appendChild(needSnap()); return; }
    const s = snap.stats;
    root.appendChild(el('h1', {}, 'Card shard time'));
    root.appendChild(el('p', { class: 'muted' }, 'How long each misc card takes to earn one shard at your current rates. Ported from the Misc Card Calc.'));
    const st = { clearsPerMin: 48, oresPerFloor: g(s, 'ores_per_floor', 10) };
    const out = el('div');
    function render() {
      const rows = OM.calc.cardShards(s, st).sort((a, b) => a.hours - b.hours);
      out.innerHTML = '';
      out.appendChild(el('div', { class: 'panel accent' }, [
        OM.table(['Card', 'Needed per shard', 'Your rate / hour', 'Time per shard'], rows.map(r => [r.name, fmt(r.need, 0), fmt(r.perHour), isFinite(r.hours) ? dur(r.hours * 3600) : el('span', { class: 'muted' }, 'never')]), { num: [1, 2, 3] }),
        el('p', { class: 'small muted', style: 'margin-top:.5rem' }, 'Rates use the stats in your export as they are, including whatever drones were equipped when you exported.')
      ]));
    }
    root.appendChild(el('div', { class: 'panel' }, el('div', { class: 'row' }, [num(st, 'clearsPerMin', 'Floor clears / min', { on: render }), num(st, 'oresPerFloor', 'Ores per floor', { on: render })])));
    root.appendChild(out);
    render();
  };
})(window.OM);

// Best floor to farm view (ores and veins).
(function (OM) {
  const el = OM.el, fmt = OM.fmt, pct = OM.pct;
  function num(state, key, label, opts) {
    opts = opts || {};
    const i = el('input', { type: 'number', value: state[key], step: opts.step || 'any', min: opts.min });
    i.addEventListener('input', () => { state[key] = Number(i.value); opts.on && opts.on(); });
    return el('label', {}, [label, i]);
  }
  function chk(state, key, label, on) {
    const i = el('input', { type: 'checkbox' }); i.checked = !!state[key];
    i.addEventListener('change', () => { state[key] = i.checked; on && on(); });
    return el('label', {}, el('span', {}, [i, ' ' + label]));
  }

  OM.views.floors = function (root, snap) {
    root.innerHTML = '';
    if (!snap) { root.appendChild(el('div', { class: 'panel' }, el('div', { class: 'empty' }, ['No snapshot selected. ', el('a', { href: '#import' }, 'Paste an export'), ' first.']))); return; }
    const s = snap.stats, D = OM.data.floors;
    root.appendChild(el('h1', {}, 'Best floor to farm'));
    root.appendChild(el('p', { class: 'muted' }, 'Expected ores or veins per hour on every floor, with and without void portals. Ported from IOM Best Floor To Farm 3.3.4.'));

    const p = OM.calc.floors.inputs(s);
    p.gameSpeed = OM.calc.floors.baseSpeed(s, p);
    const cur = Number(s.current_floor) || 1;
    const defaultOre = (D.ores.filter(o => o.floors[cur]).sort((a, b) => (b.floors[cur] || 0) - (a.floors[cur] || 0))[0] || D.ores[0]).name;
    const defaultVein = (D.veins.find(v => cur >= v.firstFloor && cur <= v.lastFloor) || D.veins[0]).name;
    const st = { mode: 'ore', ore: defaultOre, vein: defaultVein, voidC: p.voidC * 100, voidM: p.voidM, w4Quests: Number(s.world_4_quest_progress) || 0 };

    const modeSel = el('select'); [['ore', 'Ores'], ['vein', 'Veins']].forEach(([v, t]) => modeSel.appendChild(el('option', { value: v }, t)));
    const oreSel = el('select'); D.ores.forEach(o => oreSel.appendChild(el('option', { value: o.name, selected: o.name === st.ore ? '' : null }, `W${o.world} ${o.name} (floor ${o.firstFloor})`)));
    const veinSel = el('select'); D.veins.forEach(v => veinSel.appendChild(el('option', { value: v.name, selected: v.name === st.vein ? '' : null }, `${v.name} (floors ${v.firstFloor}-${v.lastFloor})`)));
    modeSel.addEventListener('change', () => { st.mode = modeSel.value; render(); });
    oreSel.addEventListener('change', () => { st.ore = oreSel.value; render(); });
    veinSel.addEventListener('change', () => { st.vein = veinSel.value; render(); });
    const out = el('div');
    const voidHint = p.voidC === 0 && Number(s.void_fuel_grade) > 0
      ? 'Your export shows 0% void portal chance (Void drone not equipped). Enter the chance and multiplier from Stats → Drones with the Void drone equipped and fueled to see the void option.'
      : 'Void portal chance and multiplier come from your export.';

    function render() {
      p.voidC = Math.min(1, st.voidC / 100); p.voidM = st.voidM; p.w4Speed = OM.calc.floors.w4Speed(st.w4Quests);
      out.innerHTML = '';
      const r = st.mode === 'ore' ? OM.calc.floors.ore(st.ore, p) : OM.calc.floors.vein(st.vein, p);
      if (!r) return;
      const unit = st.mode === 'ore' ? 'ores' : 'veins';
      const best = r.useVoid ? r.bestVoid : r.bestBase, key = r.useVoid ? 'void' : 'base';
      const top = best.slice(0, 5).filter(x => x[key] > 0);
      out.appendChild(el('div', { class: 'panel accent' }, [
        el('h2', {}, `Farm floor ${top[0].floor}${r.useVoid ? ' with the Void drone' : ' without the Void drone'}: about ${fmt(top[0][key])} ${unit} per hour`),
        el('p', {}, `That is ${pct(top[0][key] / r.perfect * 100, 0)} of a perfect floor. ` + (p.voidC > 0 ? `Best without void: floor ${r.bestBase[0].floor} at ${fmt(r.bestBase[0].base)}/h. Best with void: floor ${r.bestVoid[0].floor} at ${fmt(r.bestVoid[0].void)}/h.` : 'Void portals are at 0%, so only the base option is ranked.')),
        OM.table(['Rank', 'Floor', unit + ' / hour', 'vs. perfect', 'vs. next'], top.map((x, i) => [i + 1, x.floor, fmt(x[key]), pct(x[key] / r.perfect * 100, 0), i + 1 < top.length && top[i + 1][key] > 0 ? '+' + pct((x[key] / top[i + 1][key] - 1) * 100, 0) : '']), { num: [0, 1, 2, 3, 4] })
      ]));
      // Detail table around the item's own floors
      const own = r.rows.filter(x => x.present).map(x => x.floor);
      const lo = Math.max(1, Math.min(...own) - 2), hi = Math.min(132, Math.max(...own) + 6);
      const detail = r.rows.filter(x => (x.floor >= lo && x.floor <= hi) || x.floor === cur || best.slice(0, 5).some(b => b.floor === x.floor)).sort((a, b) => a.floor - b.floor);
      out.appendChild(el('div', { class: 'panel' }, [
        el('h2', {}, 'Floor detail'),
        OM.table(['Floor', 'Spawns here', unit + '/h no void', unit + '/h with void', 'Speed factor'], detail.map(x => ({ cells: [x.floor, x.present ? 'yes' : el('span', { class: 'muted' }, 'portals only'), fmt(x.base), fmt(x.void), OM.calc.floors.speedFactor(x.floor, p).toFixed(2) + 'x'], hl: x.floor === cur })), { num: [0, 2, 3, 4] }),
        el('p', { class: 'small muted', style: 'margin-top:.5rem' }, 'Highlighted: your current floor. Floors outside this range only matter through portals and are included when they rank in the top five.')
      ]));
    }
    root.appendChild(el('div', { class: 'panel' }, [
      el('div', { class: 'row' }, [el('label', {}, ['Farm for', modeSel]), el('label', {}, ['Ore', oreSel]), el('label', {}, ['Vein', veinSel])]),
      el('div', { class: 'row', style: 'margin-top:.6rem' }, [
        num(st, 'voidC', 'Void portal chance %', { on: render }), num(st, 'voidM', 'Void portal multiplier', { on: render }),
        num(p, 'gameSpeed', 'Base game speed', { on: render }), num(st, 'w4Quests', 'World 4 quests done', { on: render, step: '1' }), chk(p, 'w3Fix', 'World 3 speed fix bought', render),
        num(p, 'oresPerScreen', 'Ores per screen', { on: render }), chk(p, 'research', '2x vein research', render), num(p, 'morphChance', 'Veinmorpher morph chance (0-1)', { on: render }), num(p, 'morphGold', 'Veinmorpher golden chance (0-1)', { on: render })
      ]),
      el('p', { class: 'small muted', style: 'margin-top:.5rem' }, voidHint + ' Base game speed is your exported speed with the current floor\'s slowdown removed.')
    ]));
    root.appendChild(out);
    render();
  };
})(window.OM);

// Routing and state. Sections are keyed by hash: #import, #overview, #bombs, #growth, #stats, #about
(function (OM) {
  const CUR = 'om.current';
  OM.data = OM.data || {};

  OM.setCurrent = function (id) {
    try { id ? localStorage.setItem(CUR, id) : localStorage.removeItem(CUR); } catch (e) { /* ignore */ }
  };
  OM.current = function () {
    let id = null;
    try { id = localStorage.getItem(CUR); } catch (e) { /* ignore */ }
    return (id && OM.store.get(id)) || OM.store.latest();
  };

  const ROUTES = ['import', 'overview', 'growth', 'stats', 'bombs', 'floors', 'contracts', 'crafting', 'veins', 'frogger', 'lootfrogs', 'cards', 'about'];

  OM.render = function () {
    let route = (location.hash || '').replace('#', '');
    if (!ROUTES.includes(route)) route = OM.store.all().length ? 'overview' : 'import';
    document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + route));
    document.querySelectorAll('.main > section').forEach(sec => sec.classList.toggle('active', sec.id === 'view-' + route));
    const snap = OM.current();
    OM.views[route](document.getElementById('view-' + route), snap);

    // Sidebar snapshot picker
    const sel = document.getElementById('snapPick');
    sel.innerHTML = '';
    const all = OM.store.all();
    if (!all.length) sel.appendChild(OM.el('option', {}, 'none yet'));
    all.slice().reverse().forEach(s => sel.appendChild(OM.el('option', { value: s.id, selected: snap && s.id === snap.id ? '' : null }, OM.localDT(s.at) + (s.note ? ' – ' + s.note : ''))));
    sel.disabled = !all.length;
  };

  function loadData() {
    // bombs.json is inlined when built as a single file; otherwise fetch it.
    if (OM.data.bombs && OM.data.contracts && OM.data.floors) return Promise.resolve();
    return Promise.all([
      fetch('data/bombs.json').then(r => r.json()).then(d => { OM.data.bombs = d.bombs; }),
      fetch('data/contracts.json').then(r => r.json()).then(d => { OM.data.contracts = d; }),
      fetch('data/floors.json').then(r => r.json()).then(d => { OM.data.floors = d; })
    ]).catch(() => { OM.data.bombs = OM.data.bombs || []; OM.data.contracts = OM.data.contracts || { contracts: [], pointsTable: [], tags: {} }; OM.data.floors = OM.data.floors || { ores: [], veins: [], speedFloors: { ranges: [], world3: [73, 102, 0.7], world4Start: 103, voidReduced: [] }, goldenFloorCaps: { caps: [], rainbowTierScale: [], halfGoldenOre: [], prismaticMinus: [] }, w4SpeedByQuests: [[0, 0.8]] }; OM.toast('Could not load data files'); });
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('snapPick').addEventListener('change', e => { OM.setCurrent(e.target.value); OM.render(); });
    window.addEventListener('hashchange', OM.render);
    loadData().then(OM.render);
  });
})(window.OM);

</script>
